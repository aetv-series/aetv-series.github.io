<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
  --bg:#0C0F1A;--s1:#141929;--s2:#1D2339;--line:#2A3150;--ink:#F2F4FA;--muted:#A0A9C6;--y:#FFC93C;--on-y:#141929}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 "IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--y);outline-offset:3px}
h1,h2,h3,.hd{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:74rem;margin:0 auto;padding:0 1.25rem}
.bar{display:flex;align-items:center;gap:1.25rem;padding:1rem 0}
.logo{display:block;line-height:0}.logo img{display:block;height:4.2rem;width:auto}
.nav a{color:var(--muted);font-weight:600}.nav a:hover{color:var(--ink)}
.find{margin-inline-start:auto;flex:0 1 20rem}
.find input{width:100%;border:1px solid var(--line);background:var(--s1);color:var(--ink);border-radius:999px;padding:.55rem 1.1rem;font:inherit}
.find input::placeholder{color:var(--muted)}
.art{background-image:linear-gradient(160deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 16%));background-size:cover;background-position:center}
.poster{position:relative;aspect-ratio:2/3;border-radius:1rem;overflow:hidden}
.chip{position:absolute;top:.6rem;inset-inline-start:.6rem;background:rgba(12,15,26,.82);padding:.2rem .65rem;border-radius:999px;font-size:.8rem;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.75rem 1.6rem;border-radius:999px;font-weight:600;background:var(--y);color:var(--on-y)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.meta{color:var(--muted);margin:0 0 1.25rem}
.hero{margin-top:.5rem;border-radius:1.5rem;background:radial-gradient(120% 140% at 85% 0%,hsl(var(--h) 60% 28%),var(--s1) 62%);padding:clamp(1.5rem,4vw,3.5rem);display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:center}
.hero h1{font-weight:700;font-size:clamp(2.2rem,5.5vw,4.4rem);line-height:1.1;margin:0 0 1rem}
.hero p{max-width:34rem;margin:0 0 1rem;color:#D3D8EA}
.hero p.meta{color:var(--muted)}
.pw{justify-self:center;width:min(15rem,70%)}
.pw .poster{transform:rotate(-3deg);box-shadow:-.8rem .8rem 0 hsl(var(--h) 60% 48%)}
.block{padding:3rem 0 1rem}
h2{font-weight:700;font-size:1.6rem;line-height:1.2;margin:0 0 1.25rem}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1.5rem 1.1rem}
.pc{display:block}.pc .n{margin:.6rem 0 0;font-weight:600;line-height:1.35}
.back{display:inline-block;color:var(--muted);padding:1rem 0 .25rem}
.shead{display:grid;grid-template-columns:13rem 1fr;gap:2rem;align-items:end;padding:1rem 0 2.5rem}
.shead h1{font-weight:700;font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:0 0 .75rem}
.shead p{margin:0 0 1rem;max-width:36rem;color:#D3D8EA}.shead p.meta{color:var(--muted)}
.rows{display:grid;gap:.75rem}
.row{display:grid;grid-template-columns:2.5rem 11rem 1fr;align-items:center;gap:1rem;background:var(--s1);border:1px solid var(--line);border-radius:1rem;padding:.6rem 1.1rem .6rem 1rem}
.row:hover{background:var(--s2)}
.row .no{font:700 1.5rem "Readex Pro",sans-serif;color:var(--muted);text-align:center}
.rt{aspect-ratio:16/9;border-radius:.6rem}
.row h3{margin:0;font-size:1.05rem}
.row p{margin:.1rem 0 0;color:var(--muted);font-size:.9rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .d{color:var(--muted);font-size:.9rem}
.stage{display:grid;grid-template-columns:1fr 21rem;gap:1.5rem;padding:1rem 0 2rem;align-items:start}
.frame{position:relative;aspect-ratio:16/9;border-radius:1rem;overflow:hidden;background:#000;display:grid;place-items:center;align-content:center;gap:.6rem;text-align:center}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame span{padding:.35rem 1rem;border-radius:999px;background:rgba(12,15,26,.82);font-weight:600}
.info h1{font-weight:700;font-size:clamp(1.5rem,3.5vw,2.2rem);line-height:1.2;margin:1.25rem 0 .4rem}
.info .meta a{color:var(--y)}
.info p.desc{max-width:42rem;margin:0 0 1.25rem}
.pl{background:var(--s1);border:1px solid var(--line);border-radius:1rem;max-height:34rem;overflow:auto;padding:.5rem}
.pl a{display:grid;grid-template-columns:2rem 1fr;gap:.6rem;align-items:center;padding:.6rem .7rem;border-radius:.7rem;border-inline-start:3px solid transparent}
.pl a:hover{background:var(--s2)}
.pl a[aria-current="true"]{background:var(--s2);border-inline-start-color:var(--y)}
.pl .no{color:var(--muted);font-weight:600;text-align:center}.pl .d{color:var(--muted);font-size:.85rem}
footer{padding:2.5rem 1.25rem 3rem;color:var(--muted);font-size:.9rem}
@media (max-width:760px){
  .nav{display:none}
  .hero{grid-template-columns:1fr}.pw{order:-1;width:11rem}
  .shead{grid-template-columns:8rem 1fr;gap:1rem}
  .row{grid-template-columns:1.8rem 6.5rem 1fr}.row .d{display:none}
  .stage{grid-template-columns:1fr}
}

/* ---- Responsive polish (phones, tablets, desktops) ---- */
body{overflow-x:clip;-webkit-text-size-adjust:100%}
img,iframe{max-width:100%}
.wrap{padding-left:max(1.25rem,env(safe-area-inset-left,0px));padding-right:max(1.25rem,env(safe-area-inset-right,0px))}
.row>div,.pl a>span:nth-child(2){min-width:0}
.row h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl a>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:2.75rem;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.back{padding:.9rem 0 .5rem}
.find input{min-height:2.75rem}
.pl a{min-height:2.75rem}
@media (min-width:1001px){.pl{position:sticky;top:1rem}}
@media (min-width:1400px){.wrap{max-width:84rem}.posters{grid-template-columns:repeat(auto-fill,minmax(12rem,1fr))}}
@media (max-width:1000px){
  .stage{grid-template-columns:1fr}
  .pl{max-height:26rem}
}
@media (max-width:760px){
  .bar{gap:.75rem;padding:.75rem 0}
  .logo img{height:3.4rem}
  .find{flex:1 1 auto}
  .block{padding-top:2rem}
  .hero{border-radius:1.1rem;padding:1.25rem;gap:1.25rem}
  .posters{grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:1.1rem .8rem}
  .row{grid-template-columns:1.6rem 6.5rem 1fr;padding:.55rem .8rem;gap:.7rem}
  .btns .btn{flex:1 1 auto}
}
@media (max-width:480px){
  .shead{grid-template-columns:1fr;justify-items:center;text-align:center;align-items:start}
  .shead .poster{width:9rem}
  .shead .btns{justify-content:center}
  .row{grid-template-columns:1.4rem 5.2rem 1fr}
  h2{font-size:1.35rem}
}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.tab{display:inline-flex;align-items:center;min-height:2.5rem;padding:.35rem 1.1rem;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{background:var(--y);color:var(--on-y);border-color:var(--y)}
.pl .tabs{padding:.5rem .5rem 0;margin:0}
.pl .tabs{gap:.35rem;padding:.6rem .6rem .25rem}
.pl .tab{flex:1 1 auto;white-space:nowrap;padding:.35rem .3rem;font-size:.9rem;min-width:0;justify-content:center;background:var(--s2);color:var(--ink);border:1.5px solid #5a6896;font-weight:600}
.pl .tab:hover{border-color:var(--y);color:var(--y)}
.pl .tab[aria-current="true"]{background:var(--y);color:var(--on-y);border-color:var(--y);font-weight:700;box-shadow:0 0 0 3px rgba(255,201,60,.25)}
</style>
</head>

  });
  page("", '<section class="block"><h2>' + esc(SITE.all) + '</h2>' + (ps ? '<div class="posters">' + ps + '</div>' : "") +
    (rs ? '<div class="rows" style="margin-top:1.5rem">' + rs + '</div>' : "") + (!ps && !rs ? '<p class="meta">' + esc(SITE.none) + '</p>' : "") + '</section>', true);
}
function go(h){
  cur = h; q.value = ""; render();
  try { if (location.hash.slice(1) !== h) location.hash = h; } catch (err) {}
}
document.addEventListener("click", function(ev){
  var a = ev.target.closest("a[href^='#']");
  if (!a || a.target) return;
  ev.preventDefault(); go(a.getAttribute("href").slice(1));
});
window.addEventListener("hashchange", function(){
  var h = location.hash.slice(1);
  if (h !== cur){ cur = h; q.value = ""; render(); }
});
q.addEventListener("input", function(){ if (q.value.trim()) find(); else render(); });
cur = location.hash.slice(1); render();
</script>
</body>
